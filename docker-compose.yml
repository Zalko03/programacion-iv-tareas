services:
  web:
    build: .
    ports: ["8000:8000"]
    env_file: .env.docker
    depends_on:
      db:
        condition: service_healthy
      pg:
        condition: service_healthy
      redis:
        condition: service_started
  db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: taskflow_db
      MYSQL_USER: taskflow_user
      MYSQL_PASSWORD: una_clave_segura
      MYSQL_ROOT_PASSWORD: otra_clave_segura
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-potra_clave_segura"]
      interval: 5s
      retries: 20
  pg:
    image: postgres:16
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
    volumes:
      - pgdata_extra:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7
volumes:
  mysqldata:
  pgdata_extra:
